<style>
/* Layout: single-column phone app, top greeting, content cards, fixed bottom tab bar. Electric violet leads, lemon marks wins and highlights. */
:root{
  --bg:#F6F3FF; --surface:#FFFFFF; --surface2:#EFEAFF; --fg:#16112E; --muted:#6D6791; --line:#E3DCFA;
  --accent:#6A2CFF; --on-accent:#FFFFFF; --lemon:#FFE94A; --on-lemon:#16112E;
  --good:#0E9F6E; --good-bg:#DDF7EC; --bad:#E5383B; --bad-bg:#FFE3E3;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0A20; --surface:#19133A; --surface2:#241C52; --fg:#F4F1FF; --muted:#A39CCB; --line:#2E2566;
  --accent:#8F63FF; --good:#34D399; --good-bg:#10382C; --bad:#FF6B6E; --bad-bg:#40181B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0A20; --surface:#19133A; --surface2:#241C52; --fg:#F4F1FF; --muted:#A39CCB; --line:#2E2566;
  --accent:#8F63FF; --good:#34D399; --good-bg:#10382C; --bad:#FF6B6E; --bad-bg:#40181B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15} h2{font-size:19px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:14px;padding:13px 18px;min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.lemon{background:var(--lemon);color:var(--on-lemon)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.static{min-height:0;padding:3px 10px;font-size:12px;background:var(--surface2);border-color:transparent;color:var(--muted)}
.chip.hl{background:var(--lemon);color:var(--on-lemon);border-color:transparent;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(40,20,120,.15)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.lem>i{background:var(--lemon)}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;border:0}
.hero .muted{color:rgba(255,255,255,.78)}
.hero .bar{background:rgba(255,255,255,.22)} .hero .bar>i{background:var(--lemon)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:row;align-items:center;gap:14px;text-align:left;width:100%}
.sec .dot{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--accent)}
.sec .grow{flex:1;min-width:0}
.q{font-size:17px;font-weight:500;white-space:pre-wrap;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 14px;min-height:52px}
.opt .l{width:28px;height:28px;border-radius:9px;background:var(--surface2);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.opt.sel{border-color:var(--accent)} .opt.sel .l{background:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .l{background:var(--bad);color:#fff}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb strong{font-family:var(--font-display)}
.pre{white-space:pre-wrap}
details{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] summary{margin-bottom:8px}
.play{display:flex;flex-direction:row;align-items:center;gap:12px}
.play .pb{width:56px;height:56px;border-radius:50%;background:var(--lemon);color:var(--on-lemon);display:grid;place-items:center;flex:none}
.timer{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--lemon);color:var(--on-lemon);padding:4px 12px;border-radius:99px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{background:var(--lemon);color:var(--on-lemon)}
nav.tabs svg{width:42px;height:26px;padding:3px 11px;border-radius:99px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,.field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:flex;align-items:flex-end;gap:5px;height:64px}
.cols div{flex:1;background:var(--surface2);border-radius:6px;min-height:4px;position:relative}
.cols div.on{background:var(--accent)} .cols div.today{background:var(--lemon)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;max-width:90vw}
.dots{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dots button{flex:none;width:30px;height:30px;border-radius:10px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.dots button.done{background:var(--accent);color:var(--on-accent)} .dots button.cur{outline:2px solid var(--lemon)}
@media (prefers-reduced-motion:no-preference){.btn,.opt,.chip{transition:transform .08s,background .15s}.btn:active,.opt:active{transform:scale(.98)}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<div id="app"></div>
<nav class="tabs" id="nav"></nav>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  headphones: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="15" width="4" height="6" rx="1.5"/><rect x="17" y="15" width="4" height="6" rx="1.5"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  read: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  play: '<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  starOn: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const SECS = [
  { key: 'Listening', icon: 'headphones', hint: 'Percakapan & talk, diputar suara otomatis' },
  { key: 'Structure', icon: 'edit', hint: 'Sentence completion & error identification' },
  { key: 'Reading', icon: 'read', hint: 'Bacaan dengan pertanyaan pemahaman' }
];
const L = 'ABCD';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- data ---------- */
let BUILT = { q: [], t: {} };
let CUSTOM = LS.get('tep.custom', { q: [], t: {} });
let P = LS.get('tep.progress', { att: {}, days: {}, bm: {} });
let BANK = [], TEXTS = {};
const GOAL = 20;
function merge() {
  const m = new Map();
  BUILT.q.forEach(q => m.set(q.id, q));
  CUSTOM.q.forEach(q => m.set(q.id, q));
  BANK = [...m.values()];
  TEXTS = Object.assign({}, BUILT.t, CUSTOM.t);
}
const saveP = () => LS.set('tep.progress', P);
const saveC = () => LS.set('tep.custom', CUSTOM);

/* ---------- state ---------- */
let view = 'home';
let setup = { sec: 'Semua', cats: [], focus: 'all', count: 10 };
let sim = { size: 'mini' };
let ses = null;       // active session
let result = null;
let toastT = null, timerI = null;

function toast(m) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2200);
}

/* ---------- progress helpers ---------- */
function record(q, correct) {
  const a = P.att[q.id] || (P.att[q.id] = { n: 0, r: 0, last: null });
  a.n++; if (correct) a.r++; a.last = correct;
  const d = P.days[today()] || (P.days[today()] = { n: 0, r: 0 });
  d.n++; if (correct) d.r++;
}
function streak() {
  let s = 0; const d = new Date();
  if (!(P.days[today()] || {}).n) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if ((P.days[k] || {}).n) { s++; d.setDate(d.getDate() - 1); } else break;
  }
  return s;
}
function totals() {
  let n = 0, r = 0;
  Object.values(P.att).forEach(a => { n += a.n; r += a.r; });
  return { n, r, acc: n ? Math.round(r / n * 100) : 0 };
}
const byId = id => BANK.find(q => q.id === id);

/* ---------- text to speech ---------- */
const TTS = { rate: 1, playing: null, token: 0 };
function voices() {
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang));
  const us = vs.filter(v => /en[-_]US/i.test(v.lang));
  const pool = us.length ? us : vs;
  const f = pool.find(v => /female|samantha|zira|aria|jenny|google us english/i.test(v.name)) || pool[0];
  const m = pool.find(v => /\bmale\b|david|daniel|alex|mark|guy|google uk english male/i.test(v.name) && v !== f) || pool.find(v => v !== f) || f;
  return { f, m };
}
function segments(text) {
  const out = []; let who = 'n';
  String(text).split(/\n+/).forEach(line => {
    const m = line.match(/^\s*([A-Za-z][A-Za-z .'-]{0,24}):\s*(.*)$/);
    let body = line;
    if (m) { const s = m[1].toLowerCase(); who = /^(woman|girl|female|she)/.test(s) ? 'f' : /^(man|boy|male|he)/.test(s) ? 'm' : 'n'; body = m[2]; }
    (body.match(/[^.!?]+[.!?]*\s*/g) || []).map(s => s.trim()).filter(Boolean).forEach(s => out.push({ who, s }));
  });
  return out;
}
function stopSpeech() { TTS.token++; TTS.playing = null; try { speechSynthesis.cancel(); } catch (e) {} updatePlayer(); }
function playText(tid) {
  if (!('speechSynthesis' in window)) { toast('Perangkat ini belum mendukung suara'); return; }
  if (TTS.playing === tid) { stopSpeech(); return; }
  stopSpeech();
  const t = TEXTS[tid]; if (!t) return;
  const my = ++TTS.token; TTS.playing = tid;
  const v = voices(); const segs = segments(t.en);
  segs.forEach((g, i) => {
    const u = new SpeechSynthesisUtterance(g.s);
    const vo = g.who === 'm' ? v.m : g.who === 'f' ? v.f : (v.f || v.m);
    if (vo) u.voice = vo;
    u.lang = (vo && vo.lang) || 'en-US'; u.rate = TTS.rate;
    u.pitch = (vo && v.f === v.m) ? (g.who === 'm' ? .75 : g.who === 'f' ? 1.2 : 1) : 1;
    if (i === segs.length - 1) u.onend = () => { if (TTS.token === my) { TTS.playing = null; updatePlayer(); } };
    u.onerror = () => { if (TTS.token === my) { TTS.playing = null; updatePlayer(); } };
    speechSynthesis.speak(u);
  });
  updatePlayer();
}
function updatePlayer() {
  const b = $('#playbtn'); if (!b) return;
  const on = ses && TTS.playing === ses.qs[ses.i].tid;
  b.innerHTML = ic(on ? 'stop' : 'play');
  b.setAttribute('aria-label', on ? 'Hentikan audio' : 'Putar audio');
  const s = $('#playlbl'); if (s) s.textContent = on ? 'Sedang diputar…' : 'Ketuk untuk memutar';
}
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

/* ---------- session builders ---------- */
function pool() {
  let p = BANK.filter(q => setup.sec === 'Semua' || q.sec === setup.sec);
  if (setup.cats.length) p = p.filter(q => setup.cats.includes(q.cat));
  if (setup.focus === 'new') p = p.filter(q => !P.att[q.id]);
  if (setup.focus === 'wrong') p = p.filter(q => P.att[q.id] && P.att[q.id].last === false);
  return p;
}
function groupPick(sec, target) {
  const qs = BANK.filter(q => q.sec === sec);
  if (sec === 'Structure') return shuffle(qs).slice(0, target);
  const g = {}; qs.forEach(q => (g[q.tid] = g[q.tid] || []).push(q));
  const out = [];
  for (const id of shuffle(Object.keys(g))) { if (out.length >= target) break; out.push(...g[id]); }
  return out;
}
function startSession(mode, qs, extra = {}) {
  if (!qs.length) { toast('Belum ada soal yang cocok'); return; }
  stopSpeech();
  ses = Object.assign({ mode, qs, i: 0, ans: {}, rev: {}, t0: Date.now() }, extra);
  view = 'session'; render(); window.scrollTo(0, 0);
  if (mode === 'sim') {
    clearInterval(timerI);
    timerI = setInterval(() => {
      const el = $('#timer'); const left = Math.max(0, Math.ceil((ses.deadline - Date.now()) / 1000));
      if (el) el.textContent = fmt(left);
      if (left <= 0) { finishSim(); }
    }, 500);
  }
}
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function finishSim() {
  clearInterval(timerI); stopSpeech();
  if (!ses) return;
  ses.qs.forEach(q => { const a = ses.ans[q.id]; if (a !== undefined) record(q, L[a] === q.k); });
  saveP();
  result = { qs: ses.qs, ans: ses.ans, mode: 'sim', secs: Math.round((Date.now() - ses.t0) / 1000) };
  ses = null; view = 'result'; render(); window.scrollTo(0, 0);
}
function finishPractice() {
  stopSpeech();
  result = { qs: ses.qs, ans: ses.ans, mode: ses.mode, secs: Math.round((Date.now() - ses.t0) / 1000) };
  ses = null; view = 'result'; render(); window.scrollTo(0, 0);
}

/* ---------- views ---------- */
function header(title, sub) {
  return `<header><h1>${title}</h1>${sub ? `<p class="muted" style="margin:4px 0 0">${sub}</p>` : ''}</header>`;
}
function vHome() {
  const t = totals(), td = (P.days[today()] || { n: 0 }).n, st = streak();
  const pct = Math.min(100, Math.round(td / GOAL * 100));
  const wrong = BANK.filter(q => P.att[q.id] && P.att[q.id].last === false).length;
  const bms = BANK.filter(q => P.bm[q.id]).length;
  return `
  ${header('Yuk belajar TEP!', 'Latihan sedikit tiap hari lebih ampuh dari maraton sekali.')}
  <section class="hero">
    <div class="row between"><span class="label" style="color:rgba(255,255,255,.8)">Target hari ini</span><span class="chip hl static">🔥 ${st} hari beruntun</span></div>
    <div style="font-family:var(--font-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">${td}<span style="font-size:18px;opacity:.75"> / ${GOAL} soal</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <button class="btn lemon block" data-act="quick">Mulai latihan cepat</button>
  </section>
  <section class="stats">
    <div class="card stat"><span class="label">Dijawab</span><b>${t.n}</b></div>
    <div class="card stat"><span class="label">Akurasi</span><b>${t.n ? t.acc + '%' : '–'}</b></div>
    <div class="card stat"><span class="label">Bank soal</span><b>${BANK.length}</b></div>
  </section>
  <h2>Pilih bagian</h2>
  ${SECS.map(s => {
    const qs = BANK.filter(q => q.sec === s.key), done = qs.filter(q => P.att[q.id]).length;
    return `<button class="card sec" data-act="sec" data-v="${s.key}">
      <span class="dot">${ic(s.icon)}</span>
      <span class="grow"><b>${s.key}</b><br><span class="muted small">${s.hint}</span>
      <span class="bar" style="display:block;margin-top:8px"><i style="width:${qs.length ? Math.round(done / qs.length * 100) : 0}%"></i></span></span>
      <span class="muted small" style="flex:none">${done}/${qs.length}</span></button>`;
  }).join('')}
  <div class="grid2">

/* ---------- import / add ---------- */
function rowsToBank(rows) {
  let nq = 0, nt = 0;
  rows.forEach(r => {
    const g = k => String(r[k] ?? '').trim();
    if (g('Judul / Topik') && g('ID Teks')) {
      CUSTOM.t[g('ID Teks')] = { sec: g('Section'), type: g('Jenis Teks'), title: g('Judul / Topik'), en: String(r['Teks Asli (EN)'] ?? ''), idn: String(r['Terjemahan Teks (ID)'] ?? '') }; nt++; return;
    }
    if (!g('ID Soal') || !g('Kunci')) return;
    const base = { id: g('ID Soal'), cat: g('Kategori Materi') || 'Umum', o: ['Pilihan A', 'Pilihan B', 'Pilihan C', 'Pilihan D'].map(g), k: g('Kunci').toUpperCase().slice(0, 1), tr: g('Terjemahan Soal (ID)'), ex: g('Pembahasan (ID)') };
    let q;
    if (g('Bagian')) q = { ...base, sec: 'Listening', sub: g('Bagian'), tid: g('ID Teks'), q: g('Pertanyaan (EN)') };
    else if (g('Jenis Soal')) q = { ...base, sec: 'Structure', sub: g('Jenis Soal'), tid: '', q: g('Soal / Kalimat (EN)') };
    else q = { ...base, sec: 'Reading', sub: 'Reading', tid: g('ID Teks'), q: g('Pertanyaan (EN)') };
    if (!q.q || !q.o.every(Boolean) || !L.includes(q.k)) return;
    CUSTOM.q = CUSTOM.q.filter(x => x.id !== q.id); CUSTOM.q.push(q); nq++;
  });
  return { nq, nt };
}
async function onFile(e) {
  const f = e.target.files[0]; if (!f) return;
  if (!window.XLSX) { toast('Pustaka impor belum termuat. Cek koneksi.'); return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    let nq = 0, nt = 0;
    wb.SheetNames.forEach(n => { const r = rowsToBank(XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '' })); nq += r.nq; nt += r.nt; });
    saveC(); merge(); render();
    toast(nq || nt ? `Masuk: ${nq} soal, ${nt} teks` : 'Tidak ada baris yang cocok dengan format');
  } catch (err) { toast('File tidak bisa dibaca'); }
}
function onAdd(e) {
  e.preventDefault();
  const v = id => $('#' + id).value.trim();
  const sec = v('f_sec'); const mx = BANK.filter(q => q.sec === sec).length;
  const pre = { Listening: 'L', Structure: 'S', Reading: 'R' }[sec];
  const id = pre + 'U' + Date.now().toString(36).toUpperCase();
  const tid = v('f_tid');
  CUSTOM.q.push({ id, sec, sub: sec === 'Structure' ? 'Sentence Completion' : sec === 'Listening' ? 'Part A - Short Conversation' : 'Reading', cat: v('f_cat'), tid, q: v('f_q'), o: L.split('').map(l => v('f_' + l)), k: v('f_k'), tr: v('f_tr'), ex: v('f_ex') });
  if (tid && v('f_ten')) CUSTOM.t[tid] = { sec, type: '', title: tid, en: v('f_ten'), idn: v('f_tid2') };
  saveC(); merge(); render(); toast('Soal tersimpan ✓');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'tab': if (ses) { clearInterval(timerI); stopSpeech(); ses = null; } view = v; render(); window.scrollTo(0, 0); break;
    case 'quick': startSession('practice', shuffle(BANK).slice(0, 10)); break;
    case 'sec': setup = { sec: v, cats: [], focus: 'all', count: 10 }; view = 'practice'; render(); break;
    case 'setSec': setup.sec = v; setup.cats = []; render(); break;
    case 'togCat': setup.cats = setup.cats.includes(v) ? setup.cats.filter(c => c !== v) : [...setup.cats, v]; render(); break;
    case 'setFocus': setup.focus = v; render(); break;
    case 'setCount': setup.count = +v; render(); break;
    case 'startPractice': {
      let p = pool();
      const grouped = setup.sec === 'Listening' || setup.sec === 'Reading';
      if (grouped && !setup.count) p = p.slice().sort((x, y) => x.id.localeCompare(y.id));
      else p = shuffle(p);
      if (setup.count) p = p.slice(0, setup.count);
      startSession('practice', p); break;
    }
    case 'setSim': sim.size = v; render(); break;
    case 'startSim': {
      const c = sim.size === 'mini' ? { L: 10, S: 12, R: 8, min: 30 } : { L: 20, S: 25, R: 15, min: 60 };
      const qs = [...groupPick('Listening', c.L), ...groupPick('Structure', c.S), ...groupPick('Reading', c.R)];
      startSession('sim', qs, { deadline: Date.now() + c.min * 60000 }); break;
    }
    case 'reviewWrong': startSession('review', shuffle(BANK.filter(q => P.att[q.id] && P.att[q.id].last === false))); break;
    case 'reviewBm': startSession('review', BANK.filter(q => P.bm[q.id])); break;
    case 'retryWrong': startSession('review', shuffle(result.qs.filter(q => result.ans[q.id] !== undefined && L[result.ans[q.id]] !== q.k))); break;
    case 'toHome': view = 'home'; render(); break;
    case 'pick': {
      const q = ses.qs[ses.i]; if (ses.rev[q.id]) break;
      ses.ans[q.id] = +v;
      if (ses.mode !== 'sim') { ses.rev[q.id] = true; record(q, L[+v] === q.k); saveP(); }
      render(); break;
    }
    case 'next': stopSpeech(); ses.i++; render(); window.scrollTo(0, 0); break;
    case 'prev': stopSpeech(); ses.i--; render(); window.scrollTo(0, 0); break;
    case 'skip': stopSpeech(); if (ses.i < ses.qs.length - 1) { ses.i++; render(); } else finishPractice(); break;
    case 'go': stopSpeech(); ses.i = +v; render(); window.scrollTo(0, 0); break;
    case 'finish': ses.mode === 'sim' ? finishSim() : finishPractice(); break;
    case 'quit': if (ses.mode === 'sim') { finishSim(); } else if (Object.keys(ses.ans).length) { finishPractice(); } else { stopSpeech(); ses = null; view = 'home'; render(); } break;
    case 'bm': { const q = ses.qs[ses.i]; P.bm[q.id] ? delete P.bm[q.id] : (P.bm[q.id] = 1); saveP(); render(); break; }
    case 'play': playText(ses.qs[ses.i].tid); break;
    case 'rate': TTS.rate = TTS.rate === 1 ? 0.8 : TTS.rate === 0.8 ? 1.2 : 1; stopSpeech(); render(); break;
    case 'resetP':
      if (window.__rp) { P = { att: {}, days: {}, bm: {} }; saveP(); window.__rp = false; toast('Progres direset'); } else { window.__rp = true; setTimeout(() => { window.__rp = false; if (view === 'stats') render(); }, 4000); }
      render(); break;
    case 'clearCustom':
      if (window.__cc) { CUSTOM = { q: [], t: {} }; saveC(); merge(); window.__cc = false; toast('Soal tambahan dihapus'); } else { window.__cc = true; setTimeout(() => { window.__cc = false; if (view === 'bank') render(); }, 4000); }
      render(); break;
  }
});

/* ---------- boot ---------- */
$('#app').innerHTML = '<p class="muted">Memuat bank soal…</p>';
fetch('bank.json').then(r => r.json()).then(j => { BUILT = j; merge(); render(); })
  .catch(() => { merge(); $('#app').innerHTML = '<div class="card"><b>Bank soal gagal dimuat.</b><span class="muted">Muat ulang halaman ini.</span></div>'; });
})();

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
